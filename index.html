
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar cachorro aleatório</title>

    <style>
        body {
            background-color: bisque ;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: #245580;
            font-size: 32px;
        }

        button {
            background-color: #3185d8;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d5f9e;
        }

        img {
            margin-top: 20px;
            border-radius: 12px;
        }
    </style>

</head>
<body>

    <h1>Buscar cachorro</h1>

    <button id="buscar">Mostrar cachorro</button>

    <div>
        <img id="cachorro" alt="foto aleatória" width="300" height="200">
    </div>

    <script src="script.js"></script>
</body>
</html>
